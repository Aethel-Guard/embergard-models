name: Mirror curated GGUF models to release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to upload assets to'
        required: true
        default: 'v1.0.0-pluggable'

env:
  RELEASE_TAG: ${{ github.event.inputs.release_tag }}

jobs:
  mirror-qwen:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download Qwen 2.5 1.5B Instruct Q4_K_M
        run: |
          curl -L -o qwen2.5-1.5b-q4.gguf \
            "https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/qwen2.5-1.5b-instruct-q4_k_m.gguf"
          ls -lh qwen2.5-1.5b-q4.gguf

      - name: Verify SHA3-256
        run: |
          echo "Expected: sha3-256:4984ab13737302f76ed665ac7cab9f42875c80eec4519eebc814c6535e875e17"
          ACTUAL=$(python3 -c "import hashlib,sys; h=hashlib.sha3_256(); [h.update(c) for c in iter(lambda: open('qwen2.5-1.5b-q4.gguf','rb').read(16*1024*1024), b'')]; print('sha3-256:'+h.hexdigest())")
          echo "Actual:   $ACTUAL"
          [[ "$ACTUAL" == "sha3-256:4984ab13737302f76ed665ac7cab9f42875c80eec4519eebc814c6535e875e17" ]]

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$RELEASE_TAG" qwen2.5-1.5b-q4.gguf --clobber --repo ${{ github.repository }}

  mirror-tinyllama:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download TinyLlama 1.1B Chat Q4_K_M
        run: |
          curl -L -o tinyllama-1.1b-q4.gguf \
            "https://huggingface.co/TinyLlama/TinyLlama-1.1B-Chat-v1.0-GGUF/resolve/main/tinyllama-1.1b-chat-v1.0.Q4_K_M.gguf"
          ls -lh tinyllama-1.1b-q4.gguf

      - name: Verify SHA3-256
        run: |
          echo "Expected: sha3-256:27dd93103d21600b967d9f8fac8e87f31ff30ed2c613a6fee1207ef3bce6b69f"
          ACTUAL=$(python3 -c "import hashlib,sys; h=hashlib.sha3_256(); [h.update(c) for c in iter(lambda: open('tinyllama-1.1b-q4.gguf','rb').read(16*1024*1024), b'')]; print('sha3-256:'+h.hexdigest())")
          echo "Actual:   $ACTUAL"
          [[ "$ACTUAL" == "sha3-256:27dd93103d21600b967d9f8fac8e87f31ff30ed2c613a6fee1207ef3bce6b69f" ]]

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$RELEASE_TAG" tinyllama-1.1b-q4.gguf --clobber --repo ${{ github.repository }}
